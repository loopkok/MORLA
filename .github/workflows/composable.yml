name: Composable contracts and fake integration
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: dependencies/composable-test.txt
      - run: python -m pip install -r dependencies/composable-test.txt
      - run: bash scripts/test_composable.sh --layer pure
      - run: bash scripts/test_composable.sh --layer fake
      - run: python -m pip install mujoco==3.3.7
      - run: bash scripts/test_composable.sh --layer sim
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/common/morla_web_manager/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: src/common/morla_web_manager/web
