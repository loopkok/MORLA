/right_arm/nero_arm_teleop:
  ros__parameters:
    arm_side: right
    wrist_topic: /quest3/right_wrist_pose
    control_rate_hz: 125.0
    require_start_signal: true
    pos_smoothing: 0.8
    rot_smoothing: 0.8
    motion_scale: 0.65
    flip_pitch: false
    max_joint_delta_rad_per_step: 0.065
    # Temporarily bypass the Cartesian sphere and XYZ bounds; keep joint protections.
    workspace_enabled: false
    workspace_radius: 0.58
    workspace_x_min: -.inf
    workspace_x_max: .inf
    workspace_y_min: -.inf
    workspace_y_max: .inf
    workspace_z_min: -.inf
    workspace_z_max: .inf
    data_timeout_s: 0.5
    description_model_id: nero_right_arm
