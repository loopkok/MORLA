# Wuji Hand DexPilot retarget — LEFT
# See retarget_dexpilot_right.yml for tuning notes vs XHand.

retargeting:
  type: DexPilot
  urdf_path: wujihand_left.urdf

  wrist_link_name: "palm_link"
  target_joint_names:
    [
      "finger1_joint1", "finger1_joint2", "finger1_joint3", "finger1_joint4",
      "finger2_joint1", "finger2_joint2", "finger2_joint3", "finger2_joint4",
      "finger3_joint1", "finger3_joint2", "finger3_joint3", "finger3_joint4",
      "finger4_joint1", "finger4_joint2", "finger4_joint3", "finger4_joint4",
      "finger5_joint1", "finger5_joint2", "finger5_joint3", "finger5_joint4",
    ]
  finger_tip_link_names:
    [
      "finger1_tip_link",
      "finger2_tip_link",
      "finger3_tip_link",
      "finger4_tip_link",
      "finger5_tip_link",
    ]

  low_pass_alpha: 0.5

  project_dist: 0.03
  escape_dist: 0.03
