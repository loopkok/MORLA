# Quest3 hand mocap node parameters
quest3_udp_mocap:
  ros__parameters:
    # udp | tcp_wired | tcp_wireless  — 仿真/遥操 launch 默认不覆盖；改这里即可
    protocol: "tcp_wired"
    # TEMP: accept the old APK for the requested validation. This bypasses
    # source age, sequence, and session checks; set false after installing the
    # timestamped Quest APK.
    max_packet_age_s: 0.5
    allow_legacy_packets: true
    udp_port: 9000
    tcp_port: 8000
    arm_side: "both"
    ema_alpha: 0.7
    viz: true
    # XHand-only pinky stretch; leave false for Wuji (avoids Z-shaped pinky).
    enable_xhand_pinky_adapt: false
    # mano = legacy XHand (quest3 does MANO); raw = glove-compatible for Wuji retarget.
    # Wuji launches override to raw so Retargeter does not double-transform.
    landmark_preprocess: "mano"
    # Unity LH → robot (X left, Y back, Z up). false = keep Unity (+ landmarks X flip).
    convert_to_robot: true
    # Mixed/IOBT: also publish Touch 6DoF on quest3/{side}_wrist_pose (arm IK).
    controller_as_wrist: true
    # Set false if another source (e.g. glove) owns that landmarks topic.
    publish_landmarks_left: true
    publish_landmarks_right: true
    print_latency: true
    latency_print_interval: 2.0
