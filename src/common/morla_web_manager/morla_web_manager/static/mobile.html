<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>MORLA 手机遥操</title>
<style>body{margin:0;background:#111827;color:#e5e7eb;font:17px system-ui;padding:20px}main{max-width:560px;margin:auto}button,input{font:inherit}button{padding:18px;border:1px solid #64748b;border-radius:8px;background:#1f2937;color:inherit;width:100%;margin:10px 0;touch-action:none}#hold{min-height:110px;border:2px solid #22c55e}#hold[aria-pressed=true]{background:#14532d}#pad{height:200px;background:#1f2937;border:1px solid #64748b;display:grid;place-items:center;touch-action:none;user-select:none}input{width:100%;margin:24px 0}small{color:#94a3b8}output{display:block;word-break:break-all}a{color:#93c5fd}</style></head>
<body><main><h1>MORLA 手机遥操</h1><p>先在管理端准备并激活机器人。松开后重新按住绿色按钮，才允许控制。</p><output id="status">未连接</output><button id="connect">连接此输入设备</button><div id="pad" aria-label="二维虚拟摇杆">拖动控制 X / Y</div><label>末端开合<input id="scalar" type="range" min="0" max="1" step="0.01" value="0"></label><button id="hold" aria-pressed="false">按住控制 · 松开停止</button><button id="stop">断开输入并停止控制</button><small>锁屏、切换后台或网络中断后，需要回到管理端重新激活。此页面是触屏输入，不提供手机 AR 定位。</small></main>
<script>
const config=new URLSearchParams(location.hash.slice(1));let ws,epoch,sequence=0,down=false,axes={x:0,y:0,z:0,roll:0,pitch:0,yaw:0};
const status=document.querySelector('#status'),hold=document.querySelector('#hold'),pad=document.querySelector('#pad');
function release(){down=false;axes.x=axes.y=0;hold.setAttribute('aria-pressed','false')}
function close(){release();if(ws)ws.close();status.textContent='输入已断开，请在管理端重新激活后连接'}
document.querySelector('#connect').onclick=()=>{if(ws&&ws.readyState<2)return;const s=config.get('session'),i=config.get('input'),token=config.get('token');if(!s||!i||!token){status.textContent='请从管理端打开配对链接';return}ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/v2/sessions/${encodeURIComponent(s)}/inputs/${encodeURIComponent(i)}/stream`);ws.onopen=()=>{ws.send(JSON.stringify({token}));status.textContent='已连接，先松开控制按钮';release()};ws.onmessage=e=>{const msg=JSON.parse(e.data);if(msg.challenge){epoch=msg.epoch;ws.send(JSON.stringify({epoch,sequence:sequence++,challenge:msg.challenge,axes,scalar:Number(document.querySelector('#scalar').value),hold_to_control:down}))}else if(msg.receipt){status.textContent=msg.receipt.accepted?'控制输入已接收':(msg.receipt.reason==='explicit_activation_required'?'请在管理端激活后，松开再按住控制': '已连接 · 松开或等待重新锚定')}};ws.onerror=()=>status.textContent='连接失败，请检查网络与配对';ws.onclose=()=>{release();status.textContent='连接关闭，控制许可已撤销'}};
hold.onpointerdown=e=>{if(!ws||ws.readyState!==1)return;hold.setPointerCapture(e.pointerId);down=true;hold.setAttribute('aria-pressed','true')};for(const event of ['pointerup','pointercancel','lostpointercapture'])hold.addEventListener(event,release);
pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};function move(e){const r=pad.getBoundingClientRect();axes.x=Math.max(-1,Math.min(1,2*(e.clientX-r.left)/r.width-1));axes.y=Math.max(-1,Math.min(1,1-2*(e.clientY-r.top)/r.height));pad.textContent=`X ${axes.x.toFixed(2)} / Y ${axes.y.toFixed(2)}`};for(const event of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,()=>{axes.x=axes.y=0;pad.textContent='拖动控制 X / Y'});
document.querySelector('#stop').onclick=close;window.addEventListener('blur',close);window.addEventListener('pagehide',close);document.addEventListener('visibilitychange',()=>{if(document.hidden)close()});
</script></body></html>
