# Copy this file and verify every value against the robot and checkpoint.
# Never run this process alongside astral_robot_driver: both bind the SDK UDP port.
server_url: ws://192.168.1.249:8001
prompt: "Pick up the red-capped liquid container and place it into the box"
initial_gripper_ratio: 0.0  # 0=open, 1=closed; SDK has no gripper position feedback
control_hz: 30
max_joint_vel_rad_s: 6.0  # per-joint command slew limit, matching prior deployment
replan_after_rows: 10
server_timeout_s: 3.0
max_state_age_s: 0.5
max_image_age_s: 0.5

# Left arm joint radians in SDK hardware convention. Execute follows these
# points in order, verifies measured arrival, then waits for START.
init_waypoints: [-1.6, 0.2, 0.0, -1.92, -0.2, 0.0, 0.00]
init_pose: [-0.35, 0.2, 0.0, -1.92, -0.2, 0.0, 0.00]
init_joint_vel_rad_s: 0.6
init_arrive_tol_rad: 0.05
init_follow_tol_rad: 0.25
init_settle_s: 0.3
init_timeout_s: 40.0  # per segment

robot:
  board_ip: 192.168.10.2
  board_port: 5001
  local_ip: 0.0.0.0
  local_port: 8081

cameras:
  base:
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.1:1.3-video-index0
    width: 1920
    height: 1080
    fps: 30
    fourcc: YUYV
  left_wrist:
    device: /dev/v4l/by-path/platform-3610000.usb-usb-0:2.2:1.0-video-index0
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
